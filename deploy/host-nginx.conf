# Host nginx site for the production environment: /etc/nginx/sites-available/task.hasanoud.in
# HTTPS ends here; everything is passed to the web container on 127.0.0.1:8100.
# Certificate lines are managed by certbot (certbot --nginx -d task.hasanoud.in).
server {
    server_name task.hasanoud.in;

    # Proof uploads: up to 5 photos x 6MB
    client_max_body_size 35m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/task.hasanoud.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/task.hasanoud.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = task.hasanoud.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name task.hasanoud.in;
    return 404; # managed by Certbot
}
