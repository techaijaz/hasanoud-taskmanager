# Host nginx site for the production environment: /etc/nginx/sites-available/ops.hasanoud.in
# HTTPS ends here; everything is passed to the web container on 127.0.0.1:8100.
# Certificate lines are added by certbot (certbot --nginx -d ops.hasanoud.in).
server {
    listen 80;
    server_name ops.hasanoud.in;

    # Proof uploads: up to 5 photos x 6MB
    client_max_body_size 35m;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
