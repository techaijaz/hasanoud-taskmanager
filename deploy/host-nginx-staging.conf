# Host nginx site for staging: /etc/nginx/sites-available/staging.ops.hasanoud.in
# Same as production plus: noindex, and the Mailpit UI at /mailpit/ (its own login: MAILPIT_UI_AUTH).
# Certificate lines are added by certbot (certbot --nginx -d staging.ops.hasanoud.in).
server {
    listen 80;
    server_name staging.ops.hasanoud.in;

    client_max_body_size 35m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /mailpit/ {
        proxy_pass http://127.0.0.1:8125;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
